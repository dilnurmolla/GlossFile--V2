<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="register.title">GlossFile • Kayıt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      .hidden{ display:none; }
      .error{ color:#FF8A8A; }
      .success{ color:#9be29b; }

      :root{
        --navy: #08243F;
        --pink:#E689B5;
        --pink-700:#D1699F;
        --ink:#E8F0FB;
        --brand:#EED0F0;
        --icon: var(--brand);
      }

      html,body{ height:100%; }
      *, *::before, *::after{ box-sizing:border-box; }
      body{
        margin:0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color:var(--ink);
        background:#02142c;
      }

      .auth{
        min-height:100vh;
        min-height:100dvh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
      }
      .stack{
        width:min(92vw, 520px);
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:12px;
      }
      .card{
        width:min(92vw, 440px);
        background:#0e2b4f;
        border:1px solid rgba(255,255,255,.06);
        border-radius:12px;
        padding:22px 20px;
      }
      .brand-title{
        margin:0 0 12px;
        font-size:44px;
        font-weight:800;
        letter-spacing:.8px;
        color:var(--brand);
        text-align:center;
      }
      .brand-icon{
        width:56px;
        height:56px;
        color:var(--icon);
        display:block;
        margin:0 auto 8px;
        opacity:.95;
      }
      .field{
        display:grid;
        gap:8px;
        margin-top:6px;
      }
      .field-label{
        font-size:0.95rem;
        font-weight:600;
        color:#E995BC;
        letter-spacing:1px;
      }
      input{
        display:block;
        width:100%;
        height:40px;
        border-radius:12px;
        background:#0B223F;
        border:1px solid rgba(255,255,255,.06);
        color:var(--ink);
        font-size:15px;
        padding:10px 12px;
      }
      input::placeholder{ color:#BFC8D6; opacity:.9; }
      input:focus{ outline:2px solid var(--pink); border-color:transparent; }
      button{
        height:44px;
        border:none;
        border-radius:8px;
        background:var(--pink);
        color:#fff;
        font-weight:800;
        letter-spacing:.2px;
        transition: background .15s ease;
      }
      button:hover{ background:var(--pink-700); }
      button[disabled]{ opacity:.6; cursor:not-allowed; }
      .link{
        text-align:center;
        font-size:13px;
        color:#c8d2e6;
      }
      .link a{
        color:#ffd1e6;
        text-decoration:none;
      }
      .link a:hover{ text-decoration:underline; }
      .msg{
        margin-top:8px;
        font-size:0.9rem;
      }
      #register-form{
        display:grid;
        gap:10px;
      }
      #register-form input,
      #register-form button{
        margin:0;
      }
    </style>
  </head>

  <body>
    <main class="auth">
      <div class="stack">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M10 22a6 6 0 0 1 6-6h10l4 4h18a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6V22z"
                  stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="26.5" y="30.5" width="11" height="9.5" rx="2.5"
                  stroke="currentColor" stroke-width="2.6" />
            <path d="M29 30.5v-2.6c0-3 2.4-5.4 5.4-5.4s5.4 2.4 5.4 5.4v2.6"
                  stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
          <div class="brand-title">GLOSSFILE</div>
        </div>

        <form id="register-form" class="card">
          <div class="field">
            <label for="reg-username" class="field-label" data-i18n="register.username">Kullanıcı Adı</label>
            <input id="reg-username" type="text" autocomplete="username" placeholder="Kullanıcı Adı" data-i18n-placeholder="register.usernamePlaceholder" />
          </div>

          <div class="field">
            <label for="reg-email" class="field-label" data-i18n="register.email">E-posta</label>
            <input id="reg-email" type="email" autocomplete="email" placeholder="ornek@mail.com" data-i18n-placeholder="register.emailPlaceholder" />
          </div>

          <div class="field">
            <label for="reg-password" class="field-label" data-i18n="register.password">Parola</label>
            <input id="reg-password" type="password" autocomplete="new-password" placeholder="Şifre (min 8)" data-i18n-placeholder="register.passwordPlaceholder" />
          </div>

          <button id="register-btn" type="button" data-i18n="register.submit">Kayıt Ol</button>
          <div id="register-msg" class="msg"></div>
        </form>

        <div class="link">
          <span data-i18n="register.haveAccount">Zaten hesabın var mı?</span> <a href="index.html" data-i18n="register.loginLink">Giriş Yap</a>
        </div>
      </div>
    </main>

    <script src="register.js"></script>
  </body>
</html>
